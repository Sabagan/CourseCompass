spring.application.name=CourseCompass

# MySQL provided by Docker Compose (see docker-compose.yml)
# Override with DB_URL / DB_USERNAME / DB_PASSWORD environment variables if needed.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/coursecompass?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

# Spring Boot creates the tables from schema.sql on every startup (idempotent)
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Swagger Configuration
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

# Custom Credentials for Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin123
