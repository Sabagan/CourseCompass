# Tests run against an in-memory H2 database in MySQL compatibility mode,
# so `mvn test` works without Docker or a running MySQL instance.
spring.datasource.url=jdbc:h2:mem:coursecompass;MODE=MySQL;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=USER,YEAR;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# The same schema.sql used against MySQL is applied to H2
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# Custom Credentials for Security Configuration
spring.security.user.name=admin
spring.security.user.password=admin123
